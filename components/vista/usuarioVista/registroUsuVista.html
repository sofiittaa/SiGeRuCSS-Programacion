<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../../../themes/styleVistas.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <title>Registro</title>
</head>
<body class="bodyReg">
    <h1 class="title">Registrate</h1>
    
<form class="form" id="formUsuario" action="../../controlador/usuarioControlador.php" method="POST">        
    <div class="form-group">
            <label class="label" for="cedula">Cedula:</label>
            <input class="input" type="text" id="cedula" name="cedula">
        </div>

        <div class="form-group">
            <label class="label" for="nombre">Nombre:</label>
            <input class="input" type="text" id="nombre" name="nombre">
        </div>

        <div class="form-group">
            <label class="label" for="apellido">Apellido:</label>
            <input class="input" type="text" id="apellido" name="apellido">
        </div>

        <div class="form-group">
            <label class="label" for="zonaUsu">Zona:</label>
            <input class="input" type="text" id="zonaUsu" name="zonaUsu">
        </div>

        <div class="form-group">
            <label class="label" for="email">Correo Electrónico:</label>
            <input class="input" type="email" id="email" name="email">
        </div>

        <div class="form-group">
            <label class="label" for="contrasena">Contraseña</label>
            <input class="input" type="password" id="contrasena" name="contrasena" >
        </div>

        <input type="hidden" name="accion" value="crear">
        <input class="btn" type="submit" value="Registrarme">
    </form>

        <p class="text">¿Ya tienes una cuenta? <a class="link" href="loginVista.html">Inicia sesión</a></p>
