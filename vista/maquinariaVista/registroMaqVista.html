<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../../themes/styleVistas.css?v=3">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <title>Registrar maquinaria</title>
</head>
<body class="bodyReg">
    <h1 class="title">Registrar maquinaria básica</h1>

    <form class="form" id="formMaquinaria" method="POST" action="">
        <div class="form-group">
            <label class="label" for="codigoActivo">Código de activo:</label>
            <input class="input" type="text" id="codigoActivo" name="codigoActivo" maxlength="20">
        </div>

        <div class="form-group">
            <label class="label" for="tipoMaquinaria">Tipo de maquinaria:</label>
            <input class="input" type="text" id="tipoMaquinaria" name="tipoMaquinaria" maxlength="50">
        </div>

        <div class="form-group">
            <label class="label" for="numeroSerie">Número de serie:</label>
            <input class="input" type="text" id="numeroSerie" name="numeroSerie" maxlength="30">
        </div>

        <div class="form-group">
            <label class="label" for="modelo">Modelo:</label>
            <input class="input" type="text" id="modelo" name="modelo" maxlength="30">
        </div>

        <div class="form-group">
            <label class="label" for="marca">Marca:</label>
            <input class="input" type="text" id="marca" name="marca" maxlength="30">
        </div>

        <div class="form-group">
            <label class="label" for="anofabricacion">Año de fabricación:</label>
            <input class="input" type="text" id="anofabricacion" name="anofabricacion" maxlength="4">
        </div>

        <input class="btn" type="submit" value="Registrar">
    </form>

    <a href="../maquinariaVista/listarMaqVista.php" class="btn-volver">Volver</a>

    <script src="../../ajax/maquinaria/registroMaquinaria.js?v=2"></script>
