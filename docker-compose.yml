version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: sigeru_mysql_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: sofi123.20
      MYSQL_DATABASE: SiGeRu
      MYSQL_USER: sofiittaa
      MYSQL_PASSWORD: sofi123.20
    ports:
      - "3308:3306"
    volumes:
      - db_data:/var/lib/mysql
      # Esto importa tu dump automáticamente la PRIMERA vez que se crea el contenedor
      - ./DumpCSS+.sql:/docker-entrypoint-initdb.d/dump.sql

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sigeru_app
    environment:
      DB_HOST: db
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
    depends_on:
      - db

volumes:
  db_data: